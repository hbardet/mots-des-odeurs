<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ô — Récits olfactifs</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-mosaic">

<div id="wall" role="group" aria-label="Mosaïque des récits">
  <div id="scrim" aria-hidden="true"></div>
</div>

<div id="plan" role="group" aria-label="Plan des dix odeurs"></div>

<nav id="modes" aria-label="Vues">
  <a href="#plan" data-view="plan">Plan</a>
  <a href="#mosaique" data-view="mosaic">Mosaïque</a>
  <a href="#carrousel" data-view="carousel">Carrousel</a>
</nav>

<button id="prev" type="button" aria-label="Séquence précédente">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4 7 12l8 8"/></svg>
</button>
<button id="next" type="button" aria-label="Séquence suivante">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4l8 8-8 8"/></svg>
</button>

<div id="zoom-ui" hidden>
  <button id="zoom-back" type="button" aria-label="Revenir à la mosaïque">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4 7 12l8 8"/></svg>
  </button>
</div>

<div id="plan-card" role="dialog" aria-modal="true" aria-labelledby="plan-card-title" hidden>
  <div class="plan-card-panel">
    <div class="plan-card-media">
      <video id="plan-card-video" class="clip" muted playsinline loop preload="auto" aria-hidden="true"></video>
    </div>
    <div class="plan-card-text">
      <h2 id="plan-card-title"></h2>
      <p id="plan-card-summary"></p>
    </div>
    <button id="plan-card-close" type="button" aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
